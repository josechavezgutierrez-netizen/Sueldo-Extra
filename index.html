<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operación Sueldo extra</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17202A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAEE;--surface:#FFFFFF;--surface2:#F2F4F7;--ink:#17202A;--muted:#5C6875;--line:#D2D8DE;
  --tommy:#3D5A80;--walter:#13827F;--ragnar:#A0631F;--rick:#5E6B2F;--win:#2B7A4B;--loss:#B4233A;--warn:#9A6A10;--warnbg:#FBF1DC;
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1318;--surface:#192028;--surface2:#212A33;--ink:#E6EBF0;--muted:#97A3AF;--line:#2D3742;
  --tommy:#86A9D6;--walter:#45C4BF;--ragnar:#DDA05C;--rick:#B5C27A;--win:#5DC48B;--loss:#F2697F;--warn:#E6B54E;--warnbg:#2E2717;}}
:root[data-theme="dark"]{--bg:#0F1318;--surface:#192028;--surface2:#212A33;--ink:#E6EBF0;--muted:#97A3AF;--line:#2D3742;
  --tommy:#86A9D6;--walter:#45C4BF;--ragnar:#DDA05C;--rick:#B5C27A;--win:#5DC48B;--loss:#F2697F;--warn:#E6B54E;--warnbg:#2E2717;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tommy);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1,h2,h3{font-family:var(--cond);font-weight:700;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:28px}
h2{font-size:22px;margin:26px 0 10px}
h3{font-size:19px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.pay{font-size:14px;color:var(--muted);text-align:right}
.pay b{color:var(--ink);font-weight:600}

/* cuenta */
.cuenta{background:var(--surface);border-radius:14px;padding:16px;border:1px solid var(--line)}
.ledger{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;font-size:15px}
.ledger .op{font-family:var(--cond);font-size:20px;color:var(--muted);width:14px;text-align:center}
.ledger .v{font-family:var(--cond);font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.ledger .rule{grid-column:1/-1;border-top:2px solid var(--ink);margin:4px 0 2px}
.ledger .res{font-size:36px;font-weight:700}
.ledger-act{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.ibtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted)}
.ibtn svg{width:16px;height:16px}
.pos{color:var(--win)}.neg{color:var(--loss)}

/* método */
.met{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 20px;margin-top:12px;overflow:hidden;width:100%;text-align:left;display:block}
.met::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.met-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.met-name{font-family:var(--cond);font-size:24px;font-weight:700;color:var(--c)}
.pill{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.pill.vivo{color:var(--win)}.pill.caido{color:var(--loss)}.pill.cerrado{color:var(--muted)}
.met-bal{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.met-bal .num{font-size:34px}
.next{font-size:15px;margin-top:6px}
.next b{font-weight:600}
.prog{height:8px;border-radius:5px;background:var(--line);margin-top:12px;overflow:hidden}.prog>i{display:block;height:100%;background:var(--c)}
.strip{display:grid;grid-template-columns:repeat(15,1fr);gap:3px;margin-top:12px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--surface2);border:1px solid var(--line);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cell.w{background:var(--c);border-color:var(--c)}
.cell.l{background:var(--loss);border-color:var(--loss);color:#fff;font-weight:700}
.cell.now{border:2px solid var(--c);background:transparent;color:var(--c);font-weight:700}
.cell.p{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px);border-color:var(--c)}
.advice{margin-top:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.advice p{margin:0 0 6px}.advice p:last-child{margin:0}

/* botones */
.btn svg{width:16px;height:16px;vertical-align:-3px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.win{background:var(--win);color:#fff;border-color:var(--win)}
.btn.loss{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.full{width:100%}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* tarjetas genéricas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.pend{border-color:var(--warn)}
.legs{list-style:none;margin:10px 0 0;padding:0}
.legs li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.legs li span{flex:1}
.tog{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.tog.on-ok{background:var(--win);color:#fff;border-color:var(--win)}
.tog.on-no{background:var(--loss);color:#fff;border-color:var(--loss)}

/* formularios */
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input.in,select.in,textarea.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.in{min-height:90px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--cond);font-size:18px;font-weight:600}
.seg button.on{background:var(--c);color:#fff;border-color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.prin{font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fact{background:var(--surface2);border-radius:10px;padding:8px 10px}
.fact small{display:block;font-size:12px;color:var(--muted)}
.fact .num{font-size:22px}
.checks{margin-top:14px;border-radius:12px;padding:12px;background:var(--warnbg);color:var(--ink)}
.checks h3{font-size:17px;color:var(--warn)}
.checks ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.ok-note{margin-top:14px;font-size:15px;color:var(--win);font-weight:600}

/* picks */
.team{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.team-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;width:100%;background:none;border:0;text-align:left}
.team-h h3{font-size:20px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:15px}
.pk .tx{flex:1}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.rec{min-width:64px;text-align:right}
.bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--win)}
.tierlbl{font-family:var(--cond);font-size:16px;color:var(--muted);margin:22px 0 4px;font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}

/* escalera */
.lad{list-style:none;margin:10px 0 0;padding:0}
.lad li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.lad .d{font-family:var(--cond);font-size:20px;font-weight:700;color:var(--c)}
.lad .fut{opacity:.5}
.lad .det{font-size:13px;color:var(--muted);margin-top:2px}

.menu{display:grid;gap:8px;margin-top:12px}
.menu button{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;text-align:left}
.menu button span{font-weight:400;color:var(--muted);font-size:14px}
.rules{margin:0;padding-left:28px}
.rules li{padding:8px 0;border-bottom:1px solid var(--line)}

.badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border-radius:5px 5px 11px 11px;font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.02em;vertical-align:middle;margin-right:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.hoy{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.hoy .msg{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hoy .msg:first-of-type{border-top:0}
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:grid;grid-template-columns:30px 1fr auto;gap:6px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.hist .det{font-size:12px;color:var(--muted)}
.met{cursor:pointer}
.met .one{font-size:15px;margin:4px 0 0}
.daybar{height:6px;border-radius:3px;margin:-4px 0 12px}
.enjuego{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 12px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0 4px}
.seg2 button{padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg2 button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.trow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px;text-align:left}
.trow .nm{flex:1;font-weight:600}
.trow .rc{font-size:13px;color:var(--muted);text-align:right}
.ev{display:grid;grid-template-columns:62px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ev:first-child{border-top:0}
.combo{padding:12px 0;border-top:1px solid var(--line)}
.combo:first-child{border-top:0}
.combo .hd{display:flex;align-items:center;gap:4px;font-weight:600}
.tagw{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--warnbg);color:var(--warn);margin-left:6px}
.sb{padding:12px 0;border-top:1px solid var(--line)}
.sb:first-of-type{border-top:0}
.sb .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sb .line{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:6px}
.sb .tn{font-family:var(--cond);font-size:21px;font-weight:700;line-height:1.1}
.sb .tn.r{text-align:right}
.sb .tn .mine{display:inline-flex;align-items:center}
.sb .sc{display:flex;align-items:center;gap:4px}
.sb .sc input{width:42px;height:38px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-family:var(--cond);font-size:22px;font-weight:700;color:var(--ink)}
.sb .rb{display:flex;gap:6px;margin-top:8px;align-items:center}
.sb .rb button{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600}
.sb .rb button.on.G{background:var(--win);color:#fff;border-color:var(--win)}
.sb .rb button.on.P{background:var(--loss);color:#fff;border-color:var(--loss)}
.sb .rb button.on.E{background:var(--muted);color:#fff;border-color:var(--muted)}
.sb .rb button.on.OT{background:var(--warn);color:#fff;border-color:var(--warn)}
.sb .rb button.on.NC{background:var(--muted);color:#fff;border-color:var(--muted)}
.sb .tn{min-width:0;overflow-wrap:break-word;font-size:20px}
.sb .line{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.vbtn{background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;color:inherit}
.vbtn svg{width:14px;height:14px;opacity:.45}
.cmb{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.cmb:first-child{border-top:0}
.cmb .top{display:flex;align-items:center;gap:4px}
.cmb .nm{flex:1;font-weight:600;font-size:15px}
.cmb .pc{font-family:var(--cond);font-size:26px;font-weight:700}
.cmb .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:2px}
/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs .plus span{width:46px;height:46px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;margin-top:-14px;font-size:30px;line-height:1}

/* hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
.back{background:none;border:0;padding:0;font-size:15px;color:var(--muted);margin-bottom:10px}
.empty{text-align:center;padding:40px 10px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="view"><p class="muted">Cargando…</p></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const KEY="operacion-sueldo-extra-v1";
const M={tommy:{name:"Camino",c:"var(--tommy)"},walter:{name:"Kowalski",c:"var(--walter)"},ragnar:{name:"Rico",c:"var(--ragnar)"},rick:{name:"Cabo libre",c:"var(--rick)"}};
let ST=null, saveT=null, sync="local";
const UI={tab:"inicio",detail:null,draft:null,open:{},resolve:{},hist:{}};

/* ---------- utilidades ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>parseFloat(String(v??"").replace(",","."));
const r2=n=>Math.round(n*100)/100;
const ceil2=n=>Math.ceil(n*100-1e-9)/100;
const fmt=n=>Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>(n<-0.004?"−":"")+"$"+fmt(n);
const signed=n=>(n>0.004?"+":n<-0.004?"−":"")+"$"+fmt(n);
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>toISO(new Date());
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const fmtDate=s=>s?parseISO(s).toLocaleDateString("es-SV",{weekday:"short",day:"numeric",month:"short"}):"sin fecha";
const fmtD=d=>d.toLocaleDateString("es-SV",{weekday:"long",day:"numeric",month:"long"});
const daysTo=d=>Math.round((sod(d)-sod(new Date()))/864e5);
const team=id=>ST.teams.find(t=>t.id===id);
const pick=id=>ST.picks.find(p=>p.id===id);
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)}

/* ---------- guardado: celular + Google Drive ---------- */
const DKEY="ose-drive",FKEY="ose-dirty";
let DRIVE=null;try{DRIVE=JSON.parse(localStorage.getItem(DKEY))}catch(e){}
let pushing=false,again=false;
const isDirty=()=>localStorage.getItem(FKEY)==="1";
const setDirty=v=>{try{v?localStorage.setItem(FKEY,"1"):localStorage.removeItem(FKEY)}catch(e){}};
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function camMark(){if(ST)for(const a of ST.attempts)if(a.method==="tommy"&&a.status==="vivo")a.camino=true}
function commit(){camMark();ST.updatedAt=Date.now();saveLocal();setDirty(true);clearTimeout(saveT);saveT=setTimeout(pushNow,800);render()}
function renderSync(){const e=document.getElementById("sync");if(e)e.textContent=syncText()}
function syncText(){if(!DRIVE)return"Sin conectar a Google Drive. Conéctalo en Más → Google Drive.";
  return{nube:"Guardado en tu Google Drive",subiendo:"Guardando en Google Drive…",offline:"Sin internet: guardado en el celular. Se sube a Drive cuando vuelva la conexión.",error:"No se pudo guardar en Drive. Revisa Más → Google Drive.",local:"Conectando con Google Drive…"}[sync]}
async function driveGet(cfg){cfg=cfg||DRIVE;const r=await fetch(cfg.url+(cfg.url.includes("?")?"&":"?")+"clave="+encodeURIComponent(cfg.key)+"&t="+Date.now());
  const j=await r.json();if(!j.ok)throw new Error(j.error||"error");return j.data}
async function drivePut(data){const r=await fetch(DRIVE.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({clave:DRIVE.key,data})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"error")}
async function pushNow(){if(!DRIVE||!ST)return;if(pushing){again=true;return}
  pushing=true;sync="subiendo";renderSync();
  try{await drivePut(ST);setDirty(false);sync="nube"}catch(e){sync=navigator.onLine?"error":"offline"}
  pushing=false;renderSync();if(again){again=false;pushNow()}}
async function pull(){if(!DRIVE)return;
  try{const r=await driveGet();
    if(r&&(!ST||(r.updatedAt||0)>(ST.updatedAt||0))){ST=r;saveLocal();setDirty(false);sync="nube";
      const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.bind))render();return}
    if(ST&&(isDirty()||!r||(ST.updatedAt||0)>(r.updatedAt||0)))return pushNow();

function fixExcess(){if(!ST)return false;let ch=false;
  for(const a of ST.attempts){if(a.status!=="vivo"||pendingOf(a.method).length)continue;
    const bs=betsOfAttempt(a).filter(settled),last=bs[bs.length-1];

    if(ST.moves.some(m=>m.betId===last.id&&m.from===a.id&&m.type==="traspaso"&&m.note&&m.note.startsWith("Excedente")))continue;
    const ex=r2(attemptBal(a)-last.target);

  return h+`</div>`}

async function espnDirect(){const out={},now=Date.now(),desde=now-8*864e5,hasta=now+8*864e5,jobs=[];

    list.forEach((c,i)=>{const u=ESPN+c[0]+"/"+c[1]+"/teams/"+c[2];
      if(i===0)jobs.push(get(u).then(j=>{const t=j&&j.team;if(!t)return;const it=t.record&&t.record.items&&t.record.items[0];if(it&&it.summary)o.record=it.summary;if(t.standingSummary)o.standing=t.standingSummary}));
      const urls=[u+"/schedule"];if(c[0]==="soccer")urls.push(u+"/schedule?fixture=true");
      urls.forEach(su=>jobs.push(get(su).then(j=>{if(!j)return;(j.events||[]).forEach(ev=>{const ms=new Date(ev.date).getTime();if(ms<desde||ms>hasta||o.events.some(x=>x.id===ev.id))return;
        const comp=(ev.competitions||[])[0]||{},st=((comp.status||ev.status||{}).type)||{};
        o.events.push({id:ev.id,date:ev.date,name:ev.shortName||ev.name,league:(ev.league&&(ev.league.shortName||ev.league.name))||"",completed:!!st.completed,
          comps:(comp.competitors||[]).map(x=>({name:(x.team&&(x.team.shortDisplayName||x.team.displayName))||"",score:x.score&&typeof x.score==="object"?x.score.displayValue:x.score,home:x.homeAway==="home",winner:x.winner,mine:!!(x.team&&j.team&&String(x.team.id)===String(j.team.id))}))})})})))})}
  await Promise.all(jobs);return out}

const betsOfAttempt=a=>ST.bets.filter(b=>b.attemptId===a.id);
const settled=b=>b.status==="ganada"||b.status==="perdida";
function attemptBal(a){let s=a.capital;for(const b of betsOfAttempt(a))if(settled(b))s+=b.ret-b.stake;
  for(const mv of ST.moves){if(mv.from!==a.id)continue;if(mv.type==="traspaso"||mv.type==="salida")s-=mv.amount}return r2(s)}
function suggestStake(m,bal){if(m==="walter")return bal<100?Math.floor(bal/10+1e-9)*10:Math.floor(bal/20+1e-9)*20;return r2(bal)}
const liveAttempt=m=>ST.attempts.filter(a=>a.method===m&&a.status==="vivo").pop()||null;
const lastAttempt=m=>ST.attempts.filter(a=>a.method===m).pop()||null;
const pendingOf=m=>ST.bets.filter(b=>b.method===m&&b.status==="pendiente");
function dayNum(a){return betsOfAttempt(a).filter(settled).length+1}
function walterTarget(bal){return bal<100?(Math.floor(bal/10+1e-9)+1)*10:(Math.floor(bal/20+1e-9)+1)*20}
const PLAN0={s:150,k:350,ap:100,re:50,cs:1.15,wk:1.10,we:1.15};
function P(){const s=ST.settings;if(!s.plan)s.plan={...PLAN0};for(const k in PLAN0)if(!(s.plan[k]>0))s.plan[k]=PLAN0[k];return s.plan}
const FN={S:"Skipper",K:"Kowalski",C:"Cabo"},FC={S:"var(--tommy)",K:"var(--walter)",C:"var(--rick)"};
function isWE(date){const w=parseISO(date||todayISO()).getDay();return w===0||w===6}
function camFb(bal,a){if(a&&a.cabo)return"C";return bal<P().s-1e-9?"S":"K"}
function camCapF(f,a){return f==="S"?P().s:f==="K"?P().k:(a&&a.meta||Infinity)}
function camCuota(bal,date,a){return camFb(bal,a)==="S"?P().cs:(isWE(date)?P().we:P().wk)}
function camTarget(bal,date,a){a=a||liveAttempt("tommy");const cap=camCapF(camFb(bal,a),a),x=bal*camCuota(bal,date,a);return r2(x>=cap-5?Math.max(cap,bal):x)}
const betFase=b=>b.fase||(b.stake<P().s-1e-9?"S":"K");
function camNum(a){const f=camFb(attemptBal(a),a),n=betsOfAttempt(a).filter(b=>betFase(b)===f).length;return n+(pendingOf("tommy").length?0:1)}
function camLabel(a){const f=camFb(attemptBal(a),a);return`${FN[f]} · Apuesta ${camNum(a)}`}
function camEstado(a){const bal=attemptBal(a);if(!a.cabo&&bal>=P().k-1e-9)return"pasar";if(a.cabo&&!a.meta)return"sinmeta";if(a.cabo&&bal>=a.meta-1e-9)return"meta";return"juega"}
function respFund(){let s=0;for(const mv of ST.moves)if(mv.method==="respaldo")s+=mv.type==="traspaso"||mv.type==="ajuste"?mv.amount:-mv.amount;return r2(s)}
function targetFor(m,bal,date){return m==="tommy"?camTarget(bal,date):walterTarget(bal)}
function minCuota(m,bal,date){const a=liveAttempt("tommy");return m==="tommy"?Math.min(camCuota(bal,date,a),ceil2(camTarget(bal,date,a)/bal)):ceil2(walterTarget(bal)/bal)}
function ragnarFund(){let s=0;for(const mv of ST.moves)if(mv.method==="ragnar")s+=(mv.type==="entrada"||mv.type==="ajuste"||mv.type==="traspaso")?mv.amount:-mv.amount;
  for(const b of ST.bets)if((b.method==="ragnar"||b.method==="rick")&&settled(b))s+=b.ret-b.stake;return r2(s)}
function ragnarFree(){return r2(ragnarFund()-pendingOf("ragnar").concat(pendingOf("rick")).reduce((s,b)=>s+b.stake,0))}
function ragnarAlive(){return ragnarFund()>=Math.min(...ST.settings.ragnarMontos)}
function cuenta(){let ent=0,sal=0;for(const mv of ST.moves){if(mv.type==="entrada"&&mv.fuente!=="previa")ent+=mv.amount;else if(mv.type==="salida")sal+=mv.amount;else if(mv.type==="ajag")ent+=mv.amount;else if(mv.type==="ajret")sal+=mv.amount}
  let juego=0;for(const a of ST.attempts)if(a.status==="vivo")juego+=attemptBal(a);juego+=Math.max(0,ragnarFund())+respFund();

function restartAdvice(m){
  const a=lastAttempt(m);const out=[];const np=nextPayday();const lp=lastPayday();
  const paidSince=a&&a.end?lp>parseISO(a.end):false;
  if(paidSince)out.push(`<p>Ya cobraste tu sueldo después de que cayó. <b>Por fecha, ya puedes reiniciarlo.</b></p>`);
  else{const d=daysTo(np);out.push(`<p>Reinícialo con tu próximo pago: <b>${esc(fmtD(np))}</b> (${d===0?"es hoy":d===1?"falta 1 día":"faltan "+d+" días"}).</p>`)}
  const o=aliveOthers(m);
  if(o.length)out.push(`<p class="small">Tu regla 1 dice no meter más dinero mientras otro método siga vivo. Ahora mismo sigue vivo: ${esc(o.join(" y "))}.</p>`);
  const allDead=!liveAttempt("tommy")&&!liveAttempt("walter")&&!ragnarAlive();
  if(allDead){const ends=ST.attempts.map(x=>x.end).filter(Boolean).sort();const last=ends[ends.length-1];
    if(last&&parseISO(last).getDate()>20)out.push(`<p class="small">Los tres cayeron después del día 20: según tus reglas, el próximo mes arrancan solo Skipper y Kowalski con $50.</p>`)}
  return{html:out.join(""),ready:paidSince&&!o.length}}

function checks(d){
  const w=[];const s=ST.settings;
  const legs=d.legs;const teams=[...new Set(legs.map(l=>l.teamId).filter(Boolean))];
  const prin=teams.filter(t=>team(t)?.tier==="principal"),aux=teams.filter(t=>team(t)?.tier==="auxiliar");
  if(!legs.length&&!(d.method==="ragnar"&&d.sonadora))w.push({e:1,t:"Agrega al menos un pick."});
  const c=num(d.cuota);
  if(!(c>1))w.push({e:1,t:"Escribe la cuota del parlay."});
  if(d.method==="tommy"||d.method==="walter"){
    const a=liveAttempt(d.method);
    if(a){const bal=attemptBal(a),st=num(d.stake);
      if(!(st>0))w.push({e:1,t:"Escribe cuánto vas a meter."});
      else if(st>bal+1e-9)w.push({e:1,t:`Solo tienes ${money(bal)} en este método.`});
      const need=minCuota(d.method,st>0?st:bal,d.date);
      if(c>1&&c<need-1e-9)w.push({t:`La cuota ${c.toFixed(2)} no llega a la meta. Necesitas al menos ${need.toFixed(2)}.`});
      if(d.method==="walter"&&dayNum(a)>s.maxDias)w.push({t:`Ya pasaste los ${s.maxDias} días de este intento.`});
      if(d.method==="tommy"){const es=camEstado(a);
        if(es==="pasar")w.push({e:1,t:`Llegaste a ${money(P().k)}. Apartá ${money(P().ap)} y pasá a Cabo desde Inicio.`});
        else if(es==="sinmeta")w.push({e:1,t:"Poné la meta de Cabo desde Inicio."});
        else if(es==="meta")w.push({e:1,t:`Cabo llegó a su meta. Retirá desde Inicio.`});}}
    legs.filter(l=>l.pickId&&pick(l.pickId)?.player).forEach(l=>w.push({t:`“${l.text}” es estadística de jugador. En Skipper y Kowalski no se permite.`}));
  }else if(d.method==="rick"){
    const amt=num(d.stake);
    if(c>15)w.push({t:`La cuota ${c.toFixed(2)} es muy alta. ¿No la escribiste en el lugar del monto?`});
    if(!(amt>0))w.push({e:1,t:"Escribe cuánto vas a apostar."});
    else if(amt>ragnarFree()+1e-9)w.push({e:1,t:`Tu saldo disponible libre es ${money(ragnarFree())}.`});
  }else{
    const amt=num(d.stake);
    if(c>15)w.push({t:`La cuota ${c.toFixed(2)} es muy alta. ¿No la escribiste en el lugar del monto?`});
    if(!(amt>0))w.push({e:1,t:"Escribe cuánto vas a apostar."});
    else{if(!d.sonadora&&!s.ragnarMontos.includes(amt))w.push({t:`En Rico tus montos son ${s.ragnarMontos.map(x=>"$"+x).join(", ")}. Vas con $${fmt(amt)}.`});
      if(amt>ragnarFree()+1e-9)w.push({e:1,t:`El fondo de Rico solo tiene ${money(ragnarFree())} libres.`});
      const prev=ST.bets.filter(b=>b.method==="ragnar"&&settled(b)).pop();
      if(prev&&prev.status==="perdida"&&amt>prev.stake)w.push({t:`Vienes de perder $${fmt(prev.stake)} y estás subiendo el monto. Regla 18: nunca aumentar para recuperar.`});}
  }
  legs.filter(l=>!l.pickId).forEach(l=>w.push({t:`“${l.text}” no está en tu lista de picks.`}));
  legs.filter(l=>/tarjeta|c[oó]rner|falta/i.test(l.text)).forEach(l=>w.push({t:`“${l.text}”: no apuestas tarjetas, córners ni faltas.`}));
  if(!prin.length&&aux.length===1)w.push({t:"Solo hay un equipo auxiliar. Si solo juega uno, ese día no se apuesta."});
  if(prin.length===2&&aux.length)w.push({t:"Juegan dos principales: tu regla dice apostar solo a esos dos."});
  return w}

    if(m==="tommy"){const end=a.cabo?(a.meta||cur):P().k;if(!pendingOf(m).length){let dt=parseISO(todayISO()),d=start;while(cur<end-1e-9&&d<start+60){if(dt.getDay()===5){dt.setDate(dt.getDate()+1);continue}const ds=toISO(dt),tg=camTarget(cur,ds,a);h+=`<li class="fut"><span class="d">${d}</span><div>${money(cur)} → ${money(tg)} <span class="small">cuota ${Math.min(camCuota(cur,ds,a),ceil2(tg/cur)).toFixed(2)} · ${FN[camFb(cur,a)]} · ${esc(dt.toLocaleDateString("es-SV",{weekday:"short",day:"numeric"}))}</span></div><span class="small">meta</span></li>`;cur=tg;d++;dt.setDate(dt.getDate()+1)}}}
    else if(!pendingOf(m).length)for(let d=start;d<=ST.settings.maxDias;d++){const tg=targetFor(m,cur);h+=`<li class="fut"><span class="d">${d}</span><div>${money(cur)} → ${money(tg)} <span class="small">cuota ${minCuota(m,cur).toFixed(2)}</span></div><span class="small">meta</span></li>`;cur=tg}
    h+=`</ul>`}
  const prev=ST.attempts.filter(x=>x.method===m&&x!==a).reverse();
  if(prev.length){h+=`<h2>Intentos anteriores</h2>`;
    prev.forEach(x=>{const bs=betsOfAttempt(x),lost=bs.find(b=>b.status==="perdida");const peak=Math.max(x.capital,...bs.filter(b=>b.status==="ganada").map(b=>b.target?Math.min(b.ret,b.target):b.ret));const open=!!UI.hist[x.id];
      h+=`<div class="card"><div class="met-h"><h3>${x.method==="tommy"?(x.camino?"Ciclo":"Intento")+" "+x.n+(x.camino?"":" · Skipper"):"Intento "+x.n}</h3><span class="pill ${x.status}">${attLabel(x)}</span></div>
      <p class="small" style="margin:6px 0 0">Del ${esc(fmtDate(x.start))}${x.end?" al "+esc(fmtDate(x.end)):""}. Arrancó con ${money(x.capital)}, llegó a ${money(peak)} en ${bs.filter(b=>b.status==="ganada").length} días ganados.</p>
      ${open?`<ul class="hist">${bs.map((b,i)=>`<li><span class="num" style="color:${M[m].c}">${i+1}</span><div>${money(b.stake)} → ${money(b.status==="ganada"?(b.target?Math.min(b.ret,b.target):b.ret):b.stake*b.cuota)} <span class="muted">a ${b.cuota.toFixed(2)}</span><div class="det">${esc(b.legs.map(l=>l.text+(l.ok===false?" ✗":"")).join(" · ")||"sin picks")}</div></div><span class="${b.status==="ganada"?"pos":"neg"}">${b.status==="ganada"?"Ganó":"Perdió"}</span></li>`).join("")}</ul>`:
        lost?`<p class="small" style="margin:6px 0 0"><b>Lo tumbó el día ${bs.indexOf(lost)+1}:</b> ${esc(lost.legs.filter(l=>l.ok!==true).map(l=>l.text).join(" · ")||lost.legs.map(l=>l.text).join(" · "))}</p>`:""}
      ${bs.length?`<button class="link" style="margin-top:8px" data-act="toghist" data-id="${x.id}">${open?"Ocultar días":"Ver intento completo ("+bs.length+" días)"}</button>`:`<button class="link" style="margin-top:8px;color:var(--loss)" data-act="delattempt" data-id="${x.id}">Borrar este intento (no tiene apuestas)</button>`}</div>`})}
  return h}
function ragnarDetail(){

function dynPay(d){const m=d.method;const stake=num(d.stake);const c=num(d.cuota);let h="";

  let h=`<h1>Números</h1><div class="seg2"><button class="${UI.st!=="combos"?"on":""}" data-act="stab" data-id="general">General</button><button class="${UI.st==="combos"?"on":""}" data-act="stab" data-id="combos">Combinaciones</button></div>`;
  if(UI.st==="combos"){const day=UI.cv==="dia";
    h+=`<div class="chips" style="margin:6px 0 10px"><button class="chip ${!day?"on":""}" data-act="cview" data-id="ap">Apostadas</button><button class="chip ${day?"on":""}" data-act="cview" data-id="dia">Mismo día</button></div>`;
    if(day){const cs=combosDay();return h+(cs.length?`<div class="card">${cs.map(comboDayRow).join("")}</div>`:`<p class="muted">Todavía no hay días con dos principales registrados en Partidos de hoy.</p>`)}
    const cs=combos().sort((p,q)=>(q.w/q.n-p.w/p.n)||(q.n-p.n));
    return h+(cs.length?`<div class="card">${cs.map(comboRow).join("")}</div>`:`<p class="muted">Todavía no hay parlays con dos principales.</p>`)}
  h+=`<h2>Por método</h2><div class="card"><table class="t"><tr><th>Método</th><th class="r">Apuestas</th><th class="r">Ganó</th><th class="r">Perdió</th><th class="r">Acierto</th></tr>`;
  const camA=new Set(ST.attempts.filter(a=>a.camino).map(a=>a.id));const rowF=(lbl,c,f)=>{const b=ST.bets.filter(x=>settled(x)&&f(x)),w=b.filter(x=>x.status==="ganada").length;return`<tr><td style="color:${c};font-weight:600">${lbl}</td><td class="r">${b.length}</td><td class="r">${w}</td><td class="r">${b.length-w}</td><td class="r num">${b.length?Math.round(w/b.length*100)+"%":"—"}</td></tr>`};
  for(const f of["S","K","C"])h+=rowF(FN[f],FC[f],x=>x.method==="tommy"&&camA.has(x.attemptId)&&betFase(x)===f);
  h+=`<tr><td colspan="5" class="small muted" style="padding-top:10px">Antes del camino</td></tr>`;
  h+=rowF("Skipper",M.tommy.c,x=>x.method==="tommy"&&!camA.has(x.attemptId));
  for(const m of["walter","ragnar","rick"]){const s=by(m);h+=`<tr><td style="color:${M[m].c};font-weight:600">${M[m].name}</td><td class="r">${s.n}</td><td class="r">${s.w}</td><td class="r">${s.l}</td><td class="r num">${s.n?Math.round(s.w/s.n*100)+"%":"—"}</td></tr>`}
  h+=`</table></div>`;
  const cyc=ST.attempts.filter(a=>a.camino&&a.status!=="vivo");if(cyc.length){const cob=cyc.filter(a=>a.status==="cerrado").length,caid=cyc.filter(a=>a.status==="caido"),en={S:0,K:0,C:0};
    caid.forEach(a=>{const l=betsOfAttempt(a).find(b=>b.status==="perdida");if(l)en[betFase(l)]++});
    const ret=r2(ST.moves.filter(mv=>mv.type==="salida"&&camA.has(mv.from)).reduce((x,mv)=>x+mv.amount,0));
    h+=`<h2>Ciclos</h2><div class="card"><p style="margin:0">${cob} ${cob===1?"ciclo cobrado":"ciclos cobrados"} y ${caid.length} ${caid.length===1?"caído":"caídos"}${caid.length?` (en Skipper ${en.S}, Kowalski ${en.K}, Cabo ${en.C})`:""}.</p><p class="small muted" style="margin:6px 0 0">Retirado del camino: <b style="color:var(--ink)">${money(ret)}</b> · Respaldo apartado: <b style="color:var(--ink)">${money(respFund())}</b></p></div>`}
  const att=ST.attempts.filter(a=>a.method!=="ragnar"&&a.status!=="vivo"&&!a.camino);
  if(att.length){const avg=att.reduce((s,a)=>s+betsOfAttempt(a).length,0)/att.length;
    h+=`<div class="card"><p style="margin:0">Tus intentos de Skipper y Kowalski que ya terminaron duraron <b>${avg.toFixed(1)} días</b> en promedio (de ${ST.settings.maxDias}).</p></div>`}
  const all=ST.picks.map(p=>({p,s:pickStats(p)})).filter(x=>x.s.u);
  const fails=all.filter(x=>x.s.f).sort((a,b)=>b.s.f-a.s.f).slice(0,6);
  h+=`<h2>Los que te han fallado</h2>`;
  h+=fails.length?`<div class="card"><table class="t">${fails.map(({p,s})=>`<tr><td>${esc(p.text)}<div class="muted small">${tname(p.teamId)}</div></td><td class="r neg num">${s.f} ${s.f===1?"vez":"veces"}</td></tr>`).join("")}</table></div>`:`<p class="muted">Ningún pick registrado te ha fallado todavía.</p>`;
  const top=all.sort((a,b)=>b.s.u-a.s.u).slice(0,10);
  h+=`<h2>Los que más usas</h2><div class="card"><table class="t">${top.map(({p,s})=>`<tr><td>${esc(p.text)}<div class="muted small">${tname(p.teamId)}</div></td><td class="r num">${s.h}/${s.u}</td><td class="r num">${s.pct}%</td></tr>`).join("")}</table></div>`;
  const unk=ST.bets.filter(b=>b.status==="perdida"&&b.legs.length&&!b.legs.some(l=>l.ok===false)).length;
  if(unk)h+=`<p class="small muted">Hay ${unk} ${unk===1?"apuesta perdida":"apuestas perdidas"} del Excel sin saber qué pick falló. De aquí en adelante, marca ✓ o ✗ en cada pick y esta lista se vuelve exacta.</p>`;
  return h}

function gameSheet(g){const t=ttype(g.teamId),nm=team(g.teamId).name;
  const sel=(n,opts,v)=>`<select class="in" name="${n}">${opts.map(([k,l])=>`<option value="${k}" ${String(v)===k?"selected":""}>${l}</option>`).join("")}</select>`;

    (t==="fight"?`<label class="f">¿Cómo terminó?</label>${sel("how",[["",""],["KO/TKO","KO/TKO"],["Sumisión","Sumisión"],["Decisión","Decisión"],["Otro","Otro"]],g.how)}`:`<label class="f">Torneo</label><input class="in" name="how" autocomplete="off" value="${esc(g.how||"")}"><label class="f">Marcador</label><input class="in" name="score" autocomplete="off" value="${esc(g.score||"")}" placeholder="6-4 6-3">`);
  formSheet(`${g.id?"Partido":"Nuevo partido"} · ${nm}`,f,"Guardar",v=>{if(!v.rival){toast("Escribe el rival");return false}
    let comp=v.comp;if(comp==="__new"){if(!v.newcomp){toast("Escribe la competición");return false}comp=v.newcomp;const cl=compsOf(g.teamId);if(!cl.includes(comp))cl.push(comp);ST.comps[g.teamId]=cl}
    const o=g.id?g:{id:"g"+uid(),teamId:g.teamId};Object.assign(o,{date:v.date||todayISO(),time:v.time||"",rival:v.rival,comp});
    if(t==="team"){Object.assign(o,{home:v.home==="1",gf:v.gf,ga:v.ga});if(v.gf!==""&&v.ga!==""){const r=+v.gf>+v.ga?"G":+v.gf<+v.ga?"P":"E";if(!(r==="P"&&o.res==="OT"))o.res=r}}else if(t==="f1")o.pos=v.pos;else Object.assign(o,{res:v.res,how:v.how||"",score:v.score||""});
    ST.games=ST.games||[];if(!g.id)ST.games.push(o);attachGame(o);commit();toast(gRes(o)?"Resultado guardado":"Partido guardado")},
    g.id?`<button class="link" style="margin-right:auto;color:var(--loss)" id="delg">Borrar</button>`:"");
  const cmp=document.querySelector(".sheet [name=comp]"),nc=document.querySelector(".sheet [name=newcomp]");if(cmp)cmp.onchange=()=>{nc.style.display=cmp.value==="__new"?"block":"none";if(cmp.value==="__new")nc.focus()};
  const d=document.getElementById("delg");if(d)d.onclick=()=>{ST.games=ST.games.filter(x=>x!==g);closeSheet();commit()}}

    confirmSheet(`Cerrar intento ${a.n}`,`<p>Se registra que retiras ${money(bal)} de ${M[a.method].name}.</p>`,"Cerrar y cobrar",()=>{a.status="cerrado";a.end=todayISO();ST.moves.push({id:uid(),date:todayISO(),type:"salida",method:a.method,amount:bal,note:`Cobro intento ${a.n}`});UI.detail=null;commit();toast("Cobro registrado")})},
  "ragnar-load"(){formSheet("Recargar fondo de Rico",`<label class="f">Monto</label><input class="in" name="a" type="number" inputmode="decimal" value="${ST.settings.capital.ragnar}">`,"Recargar",v=>{const a=parseFloat(v.a);if(!(a>0))return false;
    ST.moves.push({id:uid(),date:todayISO(),type:"entrada",method:"ragnar",amount:a,note:"Recarga"});commit()})},
  "ragnar-out"(){formSheet("Retirar de Rico",`<label class="f">Monto (libre: ${money(ragnarFree())})</label><input class="in" name="a" type="number" inputmode="decimal">`,"Retirar",v=>{const a=parseFloat(v.a);if(!(a>0)||a>ragnarFree()+1e-9){toast("Monto inválido");return false}
    ST.moves.push({id:uid(),date:todayISO(),type:"salida",method:"ragnar",amount:a,note:"Retiro"});commit()})},
  "ragnar-fix"(){formSheet("Corregir saldo de Rico",`<p class="small muted">Escribe lo que de verdad tienes en Bet365 para Rico. La diferencia queda como ajuste: no cuenta como dinero metido ni retirado.</p><label class="f">Saldo real (la app dice ${money(ragnarFund())})</label><input class="in" name="a" type="text" inputmode="decimal">`,"Corregir",v=>{const a=num(v.a);if(!(a>=0))return false;const d=r2(a-ragnarFund());if(!d)return;

  leg(e){const b=ST.bets.find(x=>x.id===e.dataset.id),l=b.legs[+e.dataset.i],v=e.dataset.v==="1";l.ok=l.ok===v?null:v;commit()},
  camcabo(){const a=liveAttempt("tommy");if(!a||camEstado(a)!=="pasar")return;const pl=P(),bal=attemptBal(a),cab=r2(bal-pl.ap);
    formSheet("Pasar a Cabo",`<p class="small muted">Apartás ${money(pl.ap)} de respaldo (siguen en Bet365, pero no se juegan) y Cabo arranca con ${money(cab)}.</p><label class="f">Meta de Cabo</label><input class="in" name="a" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej: 550">`,"Pasar a Cabo",v=>{
      const mt=r2(num(v.a));if(!(mt>cab)){toast(`La meta tiene que ser más de ${money(cab)}`);return false}
      ST.moves.push({id:uid(),date:todayISO(),type:"traspaso",method:"respaldo",from:a.id,amount:pl.ap,note:`Respaldo apartado del ciclo ${a.n}`});
      a.cabo=true;a.caboStart=todayISO();a.caboCap=cab;a.meta=mt;commit();toast(`Cabo arranca con ${money(cab)} · meta ${money(mt)}`)})},
  cammeta(){const a=liveAttempt("tommy");if(!a||!a.cabo)return;const bal=attemptBal(a);
    formSheet("Meta de Cabo",`<label class="f">Meta (Cabo tiene ${money(bal)})</label><input class="in" name="a" type="text" inputmode="decimal" autocomplete="off" value="${a.meta||""}">`,"Guardar",v=>{
      const mt=r2(num(v.a));if(!(mt>0)){toast("Escribe la meta");return false}a.meta=mt;commit();toast(`Meta: ${money(mt)}`)})},
  camretiro(){const a=liveAttempt("tommy");if(!a||camEstado(a)!=="meta")return;const bal=attemptBal(a),pl=P();
    confirmSheet(`Retirar ${money(bal)}`,`<p>Retirás todo lo de Cabo. El ciclo ${a.n} se cierra como cobrado y Skipper vuelve a empezar con ${money(pl.re)} ${respFund()>=pl.re-1e-9?"del respaldo":"de tu bolsillo (el respaldo no alcanza)"}.</p>`,"Retirar y empezar",()=>{
      const d=todayISO();ST.moves.push({id:uid(),date:d,type:"salida",method:"tommy",from:a.id,amount:bal,note:`Retiro de Cabo, ciclo ${a.n} (meta ${money(a.meta)})`});
      a.status="cerrado";a.how="cobrado";a.end=d;camStart();commit();toast(`Retiraste ${money(bal)}`)})},
  camnuevo(){if(liveAttempt("tommy"))return;const pl=P(),usaR=respFund()>=pl.re-1e-9;
    confirmSheet(`Ciclo nuevo con ${money(pl.re)}`,usaR?`<p>Los ${money(pl.re)} salen del respaldo apartado (${money(respFund())}). No cuenta como agregado.</p>`:`<p>El respaldo no alcanza. Metés ${money(pl.re)} de tu bolsillo y se suma en "Agregado".</p>`,"Empezar",()=>{camStart();commit()})},
  settle(e){const b=ST.bets.find(x=>x.id===e.dataset.id),v=e.dataset.v;
    if(v==="ganada"){b.legs.forEach(l=>{if(l.ok==null)l.ok=true});b.ret=r2(num(UI.resolve[b.id]?.ret)||b.stake*b.cuota)}else b.ret=0;
    if(v==="perdida"&&b.legs.length&&!b.legs.some(l=>l.ok===false)){toast("Marca con ✗ el pick que falló");return}
    b.status=v;
    if(b.attemptId){const a=ST.attempts.find(x=>x.id===b.attemptId);if(v==="perdida"){a.status="caido";a.end=b.date}
      if(v==="ganada"&&b.target){const msg=roundToTarget(a,b);if(msg){delete UI.resolve[b.id];commit();toast(msg);return}}}
    b.adj=true;delete UI.resolve[b.id];commit();toast(v==="ganada"?"Ganada":"Perdida registrada")},
  delbet(e){confirmSheet("Borrar apuesta","<p>Se borra esta apuesta pendiente.</p>","Borrar",()=>{ST.bets=ST.bets.filter(x=>x.id!==e.dataset.id);ST.moves=ST.moves.filter(x=>x.betId!==e.dataset.id);commit()})},
  cview(e){UI.cv=e.dataset.id;render()},
  sonadora(){UI.draft.sonadora=!UI.draft.sonadora;if(UI.draft.sonadora){UI.draft.legs=[];UI.draft.team=null}render()},
  dm(e){const m=e.dataset.id;UI.draft.method=m;UI.draft.stake="";render()},
  amt(e){UI.draft.stake=e.dataset.id;render()},
  dteam(e){UI.draft.team=UI.draft.team===e.dataset.id?null:e.dataset.id;render()},
  addleg(e){const p=pick(e.dataset.id);UI.draft.legs.push({pickId:p.id,text:p.text,teamId:p.teamId,ok:null});render()},
  rmleg(e){UI.draft.legs.splice(+e.dataset.i,1);render()},
  addcustom(){const d=UI.draft,t=d.custom.trim();if(!t||!d.team)return;
    const p={id:"p"+uid(),teamId:d.team,text:t,player:false,baseUsed:0,baseHit:0};ST.picks.push(p);d.legs.push({pickId:p.id,text:t,teamId:d.team,ok:null});d.custom="";commit();toast("Pick agregado a tu lista")},
  savebet(){const d=UI.draft,m=d.method;let stake,attemptId=null,target;
    if(m==="tommy"||m==="walter"){const a=liveAttempt(m),bal=attemptBal(a);stake=num(d.stake);attemptId=a.id;target=targetFor(m,stake,d.date);
      const sob=r2(bal-stake);var bid="b"+uid();if(sob>0.004)ST.moves.push({id:uid(),date:d.date||todayISO(),type:"traspaso",method:"ragnar",from:a.id,betId:bid,amount:sob,note:`Sobrante de ${M[m].name.split(" ")[0]}`})}else{stake=num(d.stake);target=r2(stake*num(d.cuota))}
    const fase=m==="tommy"?camFb(attemptBal(liveAttempt("tommy")),liveAttempt("tommy")):undefined;
    ST.bets.push({id:(typeof bid!=="undefined"&&bid)||"b"+uid(),method:m,attemptId,...(fase?{fase}:{}),date:d.date||todayISO(),stake:r2(stake),cuota:num(d.cuota),target,legs:d.legs.map(l=>({...l})),status:"pendiente",ret:0,...(m==="ragnar"&&d.sonadora?{sonadora:true}:{})});
    UI.draft=null;UI.tab="inicio";commit();scrollTo(0,0);toast("Apuesta guardada")},
  toggleteam(e){const t=e.dataset.id,tier=team(t).tier;UI.open[t]=!(UI.open[t]??(tier==="principal"));render()},
  editpick(e){const p=pick(e.dataset.id);formSheet("Editar pick",`<label class="f">Pick</label><input class="in" name="text" value="${esc(p.text)}"><label class="row" style="margin-top:12px"><input type="checkbox" name="player" ${p.player?"checked":""}> Es estadística de jugador</label>`,"Guardar",v=>{if(!v.text)return false;p.text=v.text;p.player=v.player;commit()},
    `<button class="link" style="margin-right:auto;color:var(--loss)" id="delp">Borrar</button>`);
    document.getElementById("delp").onclick=()=>{ST.picks=ST.picks.filter(x=>x!==p);closeSheet();commit()}},
  newpick(e){const t=e.dataset.id;formSheet(`Nuevo pick para ${team(t).name}`,`<label class="f">Pick</label><input class="in" name="text"><label class="row" style="margin-top:12px"><input type="checkbox" name="player"> Es estadística de jugador</label>`,"Agregar",v=>{if(!v.text)return false;ST.picks.push({id:"p"+uid(),teamId:t,text:v.text,player:v.player,baseUsed:0,baseHit:0});commit()})},
  editteam(e){const t=team(e.dataset.id);formSheet("Editar equipo",teamFields(t),"Guardar",v=>{if(!v.name)return false;Object.assign(t,{name:v.name,sport:v.sport,tier:v.tier});commit()},`<button class="link" style="margin-right:auto;color:var(--loss)" id="delt">Borrar</button>`);
    document.getElementById("delt").onclick=()=>{closeSheet();confirmSheet(`Borrar ${t.name}`,"<p>También se borran sus picks de la lista. Las apuestas ya hechas se quedan.</p>","Borrar",()=>{ST.teams=ST.teams.filter(x=>x!==t);ST.picks=ST.picks.filter(p=>p.teamId!==t.id);commit()})}},
  newteam(){formSheet("Nuevo equipo",teamFields({name:"",sport:"Fútbol",tier:"auxiliar"}),"Agregar",v=>{if(!v.name)return false;ST.teams.push({id:"t"+uid(),name:v.name,sport:v.sport,tier:v.tier});commit()})},
  editrule(e){const r=ST.rules.find(x=>x.id===e.dataset.id);formSheet("Editar regla",`<textarea class="in" name="text">${esc(r.text)}</textarea>`,"Guardar",v=>{if(!v.text)return false;r.text=v.text;commit()},`<button class="link" style="margin-right:auto;color:var(--loss)" id="delr">Borrar</button>`);
    document.getElementById("delr").onclick=()=>{ST.rules=ST.rules.filter(x=>x!==r);closeSheet();commit()}},
  newrule(){formSheet("Nueva regla",`<textarea class="in" name="text"></textarea>`,"Agregar",v=>{if(!v.text)return false;ST.rules.push({id:"r"+uid(),text:v.text});commit()})},
  export(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(ST,null,1)],{type:"application/json"}));a.download=`respaldo-apuestas-${todayISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)},
  async dconnect(){const url=document.getElementById("durl").value.trim(),key=document.getElementById("dkey").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)||!key){toast("Revisa la dirección y la clave");return}
    toast("Probando conexión…");let r;try{r=await driveGet({url,key})}catch(e){toast(e.message==="clave"?"La clave no coincide con la del script":"No se pudo conectar. Revisa la dirección.");return}
    DRIVE={url,key};try{localStorage.setItem(DKEY,JSON.stringify(DRIVE))}catch(e){}
    if(r&&(!ST||(r.updatedAt||0)>=(ST.updatedAt||0))){ST=r;saveLocal();setDirty(false);sync="nube";toast("Datos traídos de tu Drive")}
    else if(ST){await pushNow();toast("Conectado. Tus datos se subieron a Drive")}
    else{sync="nube";toast("Conectado. Drive está vacío")}
    UI.tab=ST?"inicio":"drive";render();scrollTo(0,0)},
  dpush(){pushNow().then(()=>toast(sync==="nube"?"Subido a Drive":"No se pudo subir"))},
  dclear(){confirmSheet("Desconectar Drive","<p>Tus datos se quedan en el celular y en Drive, pero dejan de sincronizarse.</p>","Desconectar",()=>{DRIVE=null;localStorage.removeItem(DKEY);render()})},
  async copy(){try{await navigator.clipboard.writeText(JSON.stringify(ST));toast("Copia en el portapapeles")}catch(e){toast("No se pudo copiar")}},
  import(){const t=document.getElementById("imp").value.trim();let d;try{d=JSON.parse(t)}catch(e){toast("Ese texto no es una copia válida");return}
    if(!d||!d.settings||!Array.isArray(d.bets)){toast("Ese texto no es una copia válida");return}
    const go=()=>{ST=d;UI.tab="inicio";commit();toast("Copia restaurada")};if(!ST)return go();
    confirmSheet("Restaurar copia","<p>Todo lo actual se reemplaza por la copia.</p>","Restaurar",go)},
  closesheet(e,ev){if(ev.target===e||e.tagName==="BUTTON")closeSheet()}
};
function teamFields(t){return`<label class="f">Nombre</label><input class="in" name="name" value="${esc(t.name)}"><label class="f">Deporte o liga</label><input class="in" name="sport" value="${esc(t.sport)}">
  <label class="f">Tipo</label><select class="in" name="tier"><option value="principal" ${t.tier==="principal"?"selected":""}>Principal</option><option value="auxiliar" ${t.tier==="auxiliar"?"selected":""}>Auxiliar</option></select>`}

document.addEventListener("click",ev=>{
  const tb=ev.target.closest("[data-tab]");if(tb){if(tb.dataset.tab!==UI.tab||tb.dataset.tab!=="picks")UI.team=null;else UI.team=null;UI.tab=tb.dataset.tab;UI.detail=null;if(UI.tab==="apostar"&&!UI.draft)UI.draft=newDraft();render();scrollTo(0,0);return}
  const e=ev.target.closest("[data-act]");if(!e)return;const f=A[e.dataset.act];if(f)f(e,ev)});
document.addEventListener("input",ev=>{const e=ev.target;
  if(e.dataset.bind){if(e.dataset.bind==="ret"){(UI.resolve[e.dataset.id]||(UI.resolve[e.dataset.id]={})).ret=e.value;return}
    UI.draft[e.dataset.bind]=e.value;if(e.dataset.bind!=="custom")updDyn()}});
document.addEventListener("change",ev=>{const e=ev.target;
  if(e.dataset&&e.dataset.gs){const g=(ST.games||[]).find(x=>x.id===e.dataset.id);if(!g)return;g[e.dataset.gs]=e.value.replace(/[^0-9]/g,"");
    if(ttype(g.teamId)==="team"&&g.gf!==""&&g.gf!=null&&g.ga!==""&&g.ga!=null){const r=+g.gf>+g.ga?"G":+g.gf<+g.ga?"P":"E";if(!(r==="P"&&g.res==="OT"))g.res=r}attachGame(g);
    ST.updatedAt=Date.now();saveLocal();setDirty(true);clearTimeout(saveT);saveT=setTimeout(pushNow,800);
    setTimeout(()=>{const a=document.activeElement;if(!(a&&a.dataset&&a.dataset.gs))render()},0);return}
  if(e.id==="impfile"&&e.files[0]){e.files[0].text().then(t=>{document.getElementById("imp").value=t;toast("Archivo cargado. Toca Restaurar.")});return}
  if(!e.dataset.set)return;const k=e.dataset.set,s=ST.settings;
  if(k==="ragnarMontos"){const a=e.value.split(",").map(x=>parseFloat(x)).filter(x=>x>0);if(a.length)s.ragnarMontos=a}
  else if(k==="weekendShift")s.weekendShift=e.value;
  else{const n=parseFloat(e.value);if(!(n>0))return;if(k.startsWith("capital."))s.capital[k.split(".")[1]]=n;else if(k.startsWith("plan."))P()[k.split(".")[1]]=n;else s[k]=n}
  commit();toast("Ajuste guardado")});
function updDyn(){const d=UI.draft;if(!d)return;const p=document.getElementById("dynpay"),c=document.getElementById("dyncheck");if(p)p.innerHTML=dynPay(d);if(c)c.innerHTML=dynCheck(d)}
boot();
</script>
</body>
